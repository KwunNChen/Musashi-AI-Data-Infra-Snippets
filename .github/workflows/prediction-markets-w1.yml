name: prediction-markets-w1

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2h, offset from :00 — see note below
  workflow_dispatch: {}       # adds a manual "Run workflow" button for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Prediction Market Pipeline MVP"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m ingest.run_kalshi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - run: python -m ingest.run_polymarket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
name: prediction-markets-w1

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2h, offset from :00 (see README on delivery rate)
  workflow_dispatch: {}       # adds a manual "Run workflow" button for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Prediction Market Pipeline MVP"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m ingest.run_kalshi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - run: python -m ingest.run_polymarket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - run: python -m ingest.backfill_resolutions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()   # capture logs even if an ingestion step above failed
        with:
          name: pipeline-log-${{ github.run_id }}
          path: "Prediction Market Pipeline MVP/logs/pipeline.log"
          retention-days: 30